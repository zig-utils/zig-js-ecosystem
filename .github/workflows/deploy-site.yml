name: Ecosystem dashboard

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/site_data.py', '.github/workflows/deploy-site.yml']
  workflow_run:
    workflows: [Ecosystem]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: ecosystem-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      # workflow_run builds only the trusted default branch, never run artifacts as code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - run: python3 -m unittest discover -s tests -v
      - name: Collect public CI metadata and digest-verified measured reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/site_data.py
      - name: Install frozen STX production build dependencies
        working-directory: site
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test and render the STX dashboard
        working-directory: site
        run: |
          bun test
          bun run build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
