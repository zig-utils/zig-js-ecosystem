name: Ecosystem

on:
  workflow_call:
    inputs:
      engine_sha:
        description: Exact zig-utils/zig-js commit to test
        required: true
        type: string
      suite_ref:
        description: Immutable zig-js-ecosystem commit containing this workflow
        required: true
        type: string
      reference:
        description: Also run declared scripts on the reference Bun runtime
        default: true
        type: boolean
      repositories:
        description: Manual reproduction subset; push-triggered runs always cover all repos
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      engine_sha:
        description: Exact zig-js SHA (empty resolves current main)
        type: string
      suite_ref:
        description: Suite revision (empty uses this workflow revision)
        type: string
      reference:
        description: Also run declared scripts on reference Bun
        default: true
        type: boolean
      repositories:
        description: Optional comma-separated public repos for a focused reproduction
        type: string

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
      engine_sha: ${{ steps.revisions.outputs.engine_sha }}
      suite_ref: ${{ steps.revisions.outputs.suite_ref }}
    steps:
      - name: Resolve exact revisions
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_SHA: ${{ inputs.engine_sha }}
          SUITE_REF: ${{ inputs.suite_ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$ENGINE_SHA" ]; then
            ENGINE_SHA=$(gh api repos/zig-utils/zig-js/commits/main --jq .sha)
          fi
          if [ -z "$SUITE_REF" ]; then SUITE_REF="$WORKFLOW_SHA"; fi
          [[ "$ENGINE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SUITE_REF" =~ ^[a-f0-9]{40}$ ]]
          echo "engine_sha=$ENGINE_SHA" >> "$GITHUB_OUTPUT"
          echo "suite_ref=$SUITE_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zig-utils/zig-js-ecosystem
          ref: ${{ steps.revisions.outputs.suite_ref }}
          persist-credentials: false
      - name: Validate orchestration
        run: python3 -m unittest discover -s tests -v
      - name: Discover and freeze active public consumers
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUS_REPOSITORIES: ${{ inputs.repositories }}
        run: python3 scripts/discover.py --output results/inventory.json --only "$FOCUS_REPOSITORIES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecosystem-inventory
          path: results/inventory.json
          if-no-files-found: error
          retention-days: 30

  runtime:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zig-utils/zig-js-ecosystem
          ref: ${{ needs.discover.outputs.suite_ref }}
          path: suite
          persist-credentials: false
      - name: Read toolchain pins
        id: config
        run: |
          python3 - <<'PY'
          import json, os
          import sys
          sys.path.insert(0, 'suite/scripts')
          from provenance import runtime_optimize
          c = json.load(open('suite/config.json'))
          runtime_optimize(c)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for key in ('zig_version', 'home_repository', 'home_ref', 'pantry_version', 'runtime_optimize'):
                  f.write(f'{key}={c[key]}\n')
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zig-utils/zig-js
          ref: ${{ needs.discover.outputs.engine_sha }}
          path: engine
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ steps.config.outputs.home_repository }}
          ref: ${{ steps.config.outputs.home_ref }}
          path: home
          persist-credentials: false
      - uses: pantry-pm/pantry/packages/action@4ad0cc7b728ba6dc295fcccf9b88240f9fe610c9
        with:
          version: ${{ steps.config.outputs.pantry_version }}
          packages: zig@${{ steps.config.outputs.zig_version }}
      - name: Verify native host queries before building the engine
        working-directory: home
        run: |
          zig test -OReleaseSafe -mcpu=baseline packages/runtime/src/jsc/tool_cpu.zig -lc
          zig test -OReleaseSafe -mcpu=baseline packages/runtime/src/jsc/tool_cpu_info_linux_test.zig -lc
      - name: Build exact pushed engine archive
        working-directory: engine
        env:
          ZIG_VERSION: ${{ steps.config.outputs.zig_version }}
        run: |
          test "$(zig version)" = "$ZIG_VERSION"
          zig build home-tool-bootstrap -Dcpu=baseline -Doptimize="${{ steps.config.outputs.runtime_optimize }}"
      - name: Build Home against this engine
        working-directory: home
        # This executable is uploaded to other runners, whose CPUs can differ.
        run: zig build home-tool -Dcpu=baseline -Doptimize="${{ steps.config.outputs.runtime_optimize }}" -Dtool-js-engine=zig-js -Dzig-js-root="$GITHUB_WORKSPACE/engine"
      - name: Verify engine identity and Home host/module/TypeScript integration
        working-directory: home
        run: |
          zig-out/bin/home-tool eval 'if (Home.engine !== "zig-js") throw new Error("Wrong engine"); console.log("ECOSYSTEM ENGINE zig-js");'
          zig build home-tool-smoke home-tool-rejections-smoke home-tool-async-context-smoke home-tool-file-url-smoke -Dcpu=baseline -Doptimize="${{ steps.config.outputs.runtime_optimize }}" -Dtool-js-engine=zig-js -Dzig-js-root="$GITHUB_WORKSPACE/engine"
          zig-out/bin/home-tool run packages/runtime/test/tool_modules/arrow_object_heads.mts
          zig-out/bin/home-tool run packages/runtime/test/tool_modules/conditional_arms.mts
          zig-out/bin/home-tool run packages/runtime/test/tool_modules/compact_type_closers.mts
          zig-out/bin/home-tool run packages/runtime/test/tool_modules/late_static_imports/entry.mjs
          zig-out/bin/home-tool run packages/runtime/test/tool_modules/transpiler_sync.mjs --home-refusals
          zig-out/bin/home-tool run packages/runtime/test/tool_modules/js_extension_resolution/entry.mjs
          zig-out/bin/home-tool run packages/runtime/test/tool_modules/js_extension_resolution/guards.mjs
          zig-out/bin/home-tool run packages/runtime/test/tool_modules/source_nul.mjs --transpile
          zig-out/bin/home-tool run packages/runtime/test/tool_modules/jsdoc_runtime.mjs --transpile
          zig-out/bin/home-tool run packages/runtime/test/tool_modules/setter_runtime.mjs --transpile
          zig-out/bin/home-tool run packages/runtime/test/tool_modules/unicode_property.mjs --transpile
          python3 packages/runtime/test/tool_string_decoder_fixture.py zig-out/bin/home-tool packages/runtime/test/tool_modules/node_string_decoder.mjs
          python3 packages/runtime/test/tool_tty_stream_fixture.py zig-out/bin/home-tool packages/runtime/test/tool_modules/node_tty_stream.mjs --home-profile
          zig build test -Dfilter=ts_driver -Dts-driver-test-filter=runtime -Denable_jsc=false -Dcpu=baseline -Doptimize="${{ steps.config.outputs.runtime_optimize }}" -j1 --summary all
          zig build home-tool-source-nul -Dcpu=baseline -Doptimize="${{ steps.config.outputs.runtime_optimize }}" -Dtool-js-engine=zig-js -Dzig-js-root="$GITHUB_WORKSPACE/engine" --summary all
          zig-out/bin/home-tool run packages/runtime/test/tool_modules/vm_script.mjs
          zig-out/bin/home-tool run packages/runtime/test/tool_modules/vm_refusals.mjs
          python3 packages/runtime/test/tool_cpu_info_fixture.py zig-out/bin/home-tool packages/runtime/test/tool_modules/node_cpu_information.mjs
      - name: Package runtime and immutable provenance
        env:
          ENGINE_SHA: ${{ needs.discover.outputs.engine_sha }}
          SUITE_REF: ${{ needs.discover.outputs.suite_ref }}
        run: |
          mkdir -p runtime/engine/zig-out/lib
          cp home/zig-out/bin/home-tool runtime/home-tool
          cp engine/zig-out/lib/libzig-js.a runtime/engine/zig-out/lib/
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          config = json.load(open('suite/config.json'))
          assert subprocess.check_output(['git', '-C', 'engine', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['ENGINE_SHA']
          data = {'engine_sha': os.environ['ENGINE_SHA'], 'suite_ref': os.environ['SUITE_REF'],
                  'home_repository': config['home_repository'], 'home_ref': config['home_ref'],
                  'zig_version': subprocess.check_output(['zig', 'version'], text=True).strip(),
                  'build_cpu': 'baseline',
                  'build_optimize': config['runtime_optimize'],
                  'sha256': {str(p.relative_to('runtime')): hashlib.sha256(p.read_bytes()).hexdigest()
                             for p in pathlib.Path('runtime').rglob('*') if p.is_file()}}
          pathlib.Path('runtime/provenance.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
          # The prior cross-runner SIGILL was a ZMM vmovups in memcpy. Check
          # this exact shared-artifact regression before publishing the archive.
          objdump -d --disassemble=memcpy runtime/home-tool > "$RUNNER_TEMP/runtime-memcpy.txt"
          if grep -Eq '\bzmm[0-9]+' "$RUNNER_TEMP/runtime-memcpy.txt"; then
            cat "$RUNNER_TEMP/runtime-memcpy.txt"
            echo 'Shared runtime memcpy unexpectedly requires AVX-512' >&2
            exit 1
          fi
          tar -czf runtime.tar.gz -C runtime .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ecosystem-runtime
          path: runtime.tar.gz
          if-no-files-found: error
          retention-days: 7

  consumers:
    needs: [discover, runtime]
    name: Consumers ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zig-utils/zig-js-ecosystem
          ref: ${{ needs.discover.outputs.suite_ref }}
          persist-credentials: false
      - name: Read toolchain pins
        id: config
        run: |
          python3 - <<'PY'
          import json, os
          c = json.load(open('config.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for key in ('zig_version', 'bun_version', 'pantry_version'):
                  f.write(f'{key}={c[key]}\n')
          PY
      - uses: pantry-pm/pantry/packages/action@4ad0cc7b728ba6dc295fcccf9b88240f9fe610c9
        with:
          version: ${{ steps.config.outputs.pantry_version }}
          packages: zig@${{ steps.config.outputs.zig_version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ steps.config.outputs.bun_version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ecosystem-runtime
          path: runtime-download
      - name: Unpack and verify runtime provenance
        env:
          ENGINE_SHA: ${{ needs.discover.outputs.engine_sha }}
          ZIG_VERSION: ${{ steps.config.outputs.zig_version }}
          SUITE_REF: ${{ needs.discover.outputs.suite_ref }}
        run: |
          test "$(zig version)" = "$ZIG_VERSION"
          mkdir runtime
          tar -xzf runtime-download/runtime.tar.gz -C runtime
          python3 scripts/provenance.py runtime "$ENGINE_SHA" "$SUITE_REF"
      - name: Verify shared runtime executes on this consumer CPU
        run: timeout --signal=KILL 30s runtime/home-tool eval 'if (Home.engine !== "zig-js") throw new Error("Wrong engine"); console.log("ECOSYSTEM CONSUMER ENGINE zig-js");'
      - name: Check every selected package, library, CLI and app
        env:
          REPOSITORIES: ${{ toJSON(matrix.repositories) }}
          ENGINE_SHA: ${{ needs.discover.outputs.engine_sha }}
          REFERENCE: ${{ inputs.reference }}
        run: |
          args=()
          if [ "$REFERENCE" = true ]; then args+=(--reference); fi
          python3 scripts/run.py --repositories "$REPOSITORIES" --engine-sha "$ENGINE_SHA" \
            --home-tool "$GITHUB_WORKSPACE/runtime/home-tool" \
            --engine-root "$GITHUB_WORKSPACE/runtime/engine" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ecosystem-results-${{ matrix.id }}
          path: results/
          if-no-files-found: error
          retention-days: 30

  report:
    if: always()
    needs: [discover, runtime, consumers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: zig-utils/zig-js-ecosystem
          ref: ${{ needs.discover.outputs.suite_ref || inputs.suite_ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ecosystem-results-*
          path: results/
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ecosystem-inventory
          path: results/
      - name: Require complete results and summarize failures
        env:
          ENGINE_SHA: ${{ needs.discover.outputs.engine_sha }}
        run: python3 scripts/report.py --inventory results/inventory.json --results results --engine-sha "$ENGINE_SHA" --output results/report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ecosystem-report
          path: results/
          if-no-files-found: error
          retention-days: 30
